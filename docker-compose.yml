# Local infra for the Sensor Telemetry Platform.
# Placeholder scaffold — see /docs/SPEC.md and /CLAUDE.md.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/telemetry
      # Required — the app will not start without it. Taken from your shell or
      # a local .env (see .env.example); never hard-code a real key here.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment or .env}
    ports:
      - "8000:8000"

volumes:
  db_data:
