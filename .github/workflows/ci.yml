name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install (with dev extras)
        run: pip install ".[dev]"
      
      - name: Run package audit (pip-audit)
        run: pip-audit .

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy app tests

      # testcontainers uses the Docker daemon preinstalled on ubuntu-latest to
      # start a real TimescaleDB; no services: block needed.
      # SECRET_KEY has no default by design, so CI supplies a throwaway one. It
      # signs only tokens minted and verified inside this run — it is not a
      # secret and must never be reused for a deployed environment.
      - name: Tests (pytest + testcontainers)
        env:
          SECRET_KEY: ci-only-secret-key-not-used-for-any-deployment
        run: pytest -q

  # Independent of the backend job so the two run in parallel — a frontend-only
  # change gets its answer without waiting on testcontainers to pull Postgres.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly what the lockfile
      # pins and fails if package.json and the lockfile disagree, so CI cannot
      # silently test a different dependency tree than the one committed.
      - name: Install (from lockfile)
        run: npm ci

      - name: Audit (high severity and above)
        run: npm audit --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type-check (tsc strict)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      # The build is its own gate: `tsc --noEmit` does not exercise the bundler,
      # so a broken import path or a bad Vite config only surfaces here.
      - name: Build
        run: npm run build
